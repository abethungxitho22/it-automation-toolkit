name: Toolkit CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolkit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q --junitxml=ci-results/tests.xml
      - run: python scripts/smoke_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python }}
          path: ci-results/
          retention-days: 14

  build:
    name: Build and smoke-test image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build once
        run: |
          docker build --pull --tag toolkit:ci \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .
      - name: Exercise the packaged toolkit as its non-root user
        run: |
          docker run --rm toolkit:ci --help
          docker run --rm --entrypoint python \
            --mount "type=bind,src=$PWD/scripts/smoke_test.py,dst=/tmp/smoke_test.py,readonly" \
            toolkit:ci /tmp/smoke_test.py /app
          docker save --output image.tar toolkit:ci
      - uses: actions/upload-artifact@v4
        with:
          name: toolkit-image
          path: image.tar
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  scan:
    name: Scan image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: toolkit-image
      - name: Block HIGH and CRITICAL vulnerabilities and secrets
        run: |
          mkdir -p ci-results
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$PWD,dst=/work" \
            ghcr.io/aquasecurity/trivy:0.74.0@sha256:ee940acbf1f58ebadb42d01434ce4609530bf1b52536afbd1eee66cd7123c5c9 \
            image --cache-dir /tmp/trivy --input /work/image.tar \
            --scanners vuln,secret --severity HIGH,CRITICAL \
            --exit-code 1 --format json --output /work/ci-results/trivy.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-scan
          path: ci-results/
          retention-days: 14

  publish:
    name: Publish scanned image
    needs: scan
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: toolkit-image
      - name: Push the exact scanned image and record its digest
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker load --input image.tar
          docker tag toolkit:ci "$image"
          docker push "$image"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image")
          echo "image=$digest" >> "$GITHUB_OUTPUT"
          echo "Published: \`$digest\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy batch toolkit
    needs: publish
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64, toolkit-deploy]
    environment: production
    concurrency:
      group: toolkit-production
      cancel-in-progress: false
    timeout-minutes: 15
    permissions:
      packages: read
    steps:
      - name: Pull by digest and run the batch against the deployment workspace
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.publish.outputs.image }}
          DATA_DIR: ${{ vars.TOOLKIT_DATA_DIR }}
        run: |
          test -n "$DATA_DIR" && [[ "$DATA_DIR" = /* ]]
          test -d "$DATA_DIR/inbox"
          test -f "$DATA_DIR/application.log"
          test -f "$DATA_DIR/records.csv"
          test -f "$DATA_DIR/expected_files.txt"
          test -w "$DATA_DIR"
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker pull "$IMAGE"
          docker run --rm --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$DATA_DIR,dst=/data" \
            "$IMAGE" --folder /data/inbox --log /data/application.log \
            --csv /data/records.csv --expected /data/expected_files.txt --format json
          docker run --rm --user "$(id -u):$(id -g)" --entrypoint python \
            --mount "type=bind,src=$DATA_DIR,dst=/data,readonly" "$IMAGE" -c \
            'import json; from pathlib import Path; r=json.loads(Path("reports/summary_report.json").read_text()); assert len(r["checks_performed"]) == 5, r; assert Path("clean_records.csv").is_file()'
          echo "Deployed and executed: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
